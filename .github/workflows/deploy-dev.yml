name: Deploy to Development

on:
  push:
    branches: [ dev, develop ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: todos-containerapp-rg
  CONTAINER_APP_NAME: todos-api-dev
  ACR_NAME: todosacr3863
  IMAGE_NAME: todos-backend
  ENVIRONMENT: Development

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: development
    concurrency:
      group: development-deployment
      cancel-in-progress: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Get ACR login server
      id: acr
      run: |
        LOGIN_SERVER=$(az acr show --name ${{ env.ACR_NAME }} --query loginServer -o tsv)
        echo "login_server=$LOGIN_SERVER" >> $GITHUB_OUTPUT
        echo "ACR Login Server: $LOGIN_SERVER"

    - name: Build and push image to ACR
      run: |
        # Login to ACR
        az acr login --name ${{ env.ACR_NAME }}

        # Build image
        docker build -t ${{ env.IMAGE_NAME }}:dev -f Todo.Api/Dockerfile .

        # Tag with commit SHA and dev tag
        docker tag ${{ env.IMAGE_NAME }}:dev ${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_NAME }}:dev-${{ github.sha }}
        docker tag ${{ env.IMAGE_NAME }}:dev ${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_NAME }}:dev

        # Push both tags
        docker push ${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_NAME }}:dev-${{ github.sha }}
        docker push ${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_NAME }}:dev

        echo "Pushed dev image: ${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_NAME }}:dev-${{ github.sha }}"

    - name: Update Azure Container App
      run: |
        az containerapp update \
          --name ${{ env.CONTAINER_APP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --image ${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_NAME }}:dev-${{ github.sha }}

        echo "Development Container App updated successfully"

    - name: Get Container App URL
      id: app-url
      run: |
        APP_URL=$(az containerapp show \
          --name ${{ env.CONTAINER_APP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --query properties.configuration.ingress.fqdn \
          --output tsv)
        echo "app_url=$APP_URL" >> $GITHUB_OUTPUT
        echo "Development URL: https://$APP_URL"

    - name: Deployment Summary
      run: |
        echo "## 🧪 Development Deployment Successful" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Environment:** Development" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Image:** \`${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_NAME }}:dev-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Application URL:** https://${{ steps.app-url.outputs.app_url }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Endpoints" >> $GITHUB_STEP_SUMMARY
        echo "- Root: https://${{ steps.app-url.outputs.app_url }}/" >> $GITHUB_STEP_SUMMARY
        echo "- Health: https://${{ steps.app-url.outputs.app_url }}/health" >> $GITHUB_STEP_SUMMARY
        echo "- API: https://${{ steps.app-url.outputs.app_url }}/api/todo" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Testing" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
        echo "curl https://${{ steps.app-url.outputs.app_url }}/health" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
